# Monorepo → Amvera (Python pip, без Docker).
# Amvera тянет весь GitHub-репозиторий; код relay лежит в deploy/amvera/.
meta:
  environment: python
  toolchain:
    name: pip
    version: "3.11"

build:
  requirementsPath: deploy/amvera/requirements.txt
  useCache: false

run:
  scriptName: deploy/amvera/run.py
  containerPort: 80
